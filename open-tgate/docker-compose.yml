# Open-TGate local stack.
#
# Default (`docker compose up --build`) runs the two persistent backend
# services. The dashboard is a Cloudflare Worker; include it with
#   docker compose --profile dashboard up --build
# (or run `npm run dev` in open-tgate/dashboard).
services:
  api:
    build:
      context: ..
      dockerfile: open-tgate/Dockerfile.api
    env_file: .env
    environment:
      PORT: "8000"
    # The optional dashboard shares this network namespace; publish its port here.
    ports: ["8000:8000", "3000:8787"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: open-tgate/Dockerfile.worker
    env_file: .env
    volumes: ["tdlib-state:/data/tdlib"]
    depends_on:
      api:
        condition: service_healthy
  dashboard:
    profiles: ["dashboard"]
    # Loopback HTTP is allowed by the Worker's backend HTTPS policy.
    network_mode: "service:api"
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --ip 0.0.0.0 --port 8787 --var API_BASE_URL:$${API_BASE_URL}'
    environment:
      # Pass this through --var so it overrides the deployed wrangler.toml URL.
      API_BASE_URL: http://127.0.0.1:8000
    volumes: ["./dashboard:/app"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  tdlib-state:

