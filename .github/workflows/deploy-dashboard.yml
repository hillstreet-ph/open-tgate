name: Deploy Dashboard (Cloudflare)

# Deploys the Open-TGate Cloudflare Worker landing page (open-tgate/dashboard).
#
# The Worker deploy talks to api.cloudflare.com, which is not reachable from
# the restricted agent environment — so deployment runs here, on a GitHub
# runner with open egress. It is a no-op until the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist, so merging this never
# turns CI red. Add those two secrets (Settings → Secrets and variables →
# Actions), then push to master or run this workflow manually to publish.
#
# Required token scope: "Workers Scripts: Edit" (+ the account the Worker
# lives in). Never commit the token; it lives only in Actions secrets.

on:
  push:
    branches: [master]
    paths:
      - "open-tgate/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: open-tgate/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deploy secrets
        id: guard
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dashboard deploy skipped::Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable the Cloudflare Worker deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: open-tgate/dashboard/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Validate build (dry-run)
        if: steps.guard.outputs.configured == 'true'
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        if: steps.guard.outputs.configured == 'true'
        run: npx wrangler deploy
