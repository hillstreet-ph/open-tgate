name: Auto-merge

# Autonomous merge for approved automation PRs. When a pull request carries the
# `auto-merge` label (the coordination label defined in AGENTS.md) and is not a
# draft, GitHub's native auto-merge is enabled so the PR merges itself as soon
# as all required status checks pass — no human click.
#
# Repo settings required for this to complete a merge with no human:
#   * Settings → General → "Allow auto-merge" = on.
#   * Branch protection on master: require the CI checks, but do NOT require a
#     human approving review (or provide an automated approver). Auto-merge
#     still waits for every required check, so tests always gate the merge.
#
# Uses pull_request_target (base-repo context, write-scoped token) and never
# checks out PR head code, so untrusted PR code cannot run with the token.

on:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile native auto-merge
    # Only act on PRs into the protected production branch. Enabling auto-merge
    # on a base without required CI checks could merge before tests finish, so
    # this workflow refuses to touch any other base.
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The `auto-merge` coordination label, or a release-please PR (labeled
          # `autorelease: pending`) — both should merge themselves once checks
          # pass, so the release path is hands-off too.
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'auto-merge') }}
          RELEASE: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          if { [ "$LABELED" = "true" ] || [ "$RELEASE" = "true" ]; } && [ "$DRAFT" = "false" ]; then
            echo "Eligible and ready -> enabling auto-merge (squash)"
            # Capture output so we can distinguish verified-benign outcomes
            # (auto-merge disabled at the repo level, or the PR already merged /
            # in a clean state that needs no queue) from real failures such as a
            # permission loss or a transient API error, which must fail the job
            # so it is retried rather than silently reported as success.
            set +e
            out="$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1)"; rc=$?
            set -e
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              if printf '%s' "$out" | grep -qiE 'allow auto-?merge|auto-?merge is not (allowed|enabled)|not in the correct state|already merged|clean status|pull request is not mergeable: the base branch policy prohibits the merge'; then
                echo "::warning::Native auto-merge not enabled (verified-benign: '$out'). Enable Settings → General → Allow auto-merge, or the PR already merged / needs no queue."
              else
                echo "::error::Enabling auto-merge failed for an unexpected reason: $out"
                exit "$rc"
              fi
            fi
          else
            # Label removed (or PR draft): revoke auto-merge so a revoked
            # approval cannot still merge when checks finish.
            echo "Not eligible or draft -> disabling auto-merge"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          fi
