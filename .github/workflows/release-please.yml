name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created by release-please use GITHUB_TOKEN, and `push` events caused by
  # GITHUB_TOKEN do not start new workflow runs — so release-dockerhub.yml's
  # `push: tags` trigger never fires for an automated release, and GITHUB_TOKEN
  # cannot start a workflow_dispatch run either. Call it directly as a reusable
  # workflow so a merged release PR reliably publishes the versioned images the
  # Zeabur backend deploy pins to.
  publish-images:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-dockerhub.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
